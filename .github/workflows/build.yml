name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/EgyptRobloxSplitProxy.sln
      - name: Build
        run: dotnet build src/EgyptRobloxSplitProxy.sln --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/EgyptRobloxSplitProxy/EgyptRobloxSplitProxy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyptRobloxSplitProxy
          path: src/EgyptRobloxSplitProxy/bin/Release/net8.0-windows/win-x64/publish/EgyptRobloxSplitProxy.exe